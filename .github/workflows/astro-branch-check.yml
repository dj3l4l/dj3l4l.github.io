name: Astro migration check

on:
  push:
    branches: [astro-migration]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-site
          path: dist
          if-no-files-found: error

# This workflow intentionally has no GitHub Pages permissions and no deploy job.
# It can validate astro-migration without changing djelalosman.com.
